name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mynutri_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mynutri_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mynutri_test_ci
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mynutri_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Verify Python lock drift and shared versions
        working-directory: backend
        run: |
          pip-compile --allow-unsafe --all-build-deps --generate-hashes --resolver=backtracking --strip-extras --output-file=requirements.lock pyproject.toml
          pip-compile --allow-unsafe --all-build-deps --extra=dev --generate-hashes --resolver=backtracking --strip-extras --output-file=requirements-dev.lock pyproject.toml
          git diff --exit-code -- requirements.lock requirements-dev.lock
          python - <<'PY'
          from pathlib import Path

          def pins(name: str) -> dict[str, str]:
              result = {}
              for line in Path(name).read_text(encoding="utf-8").splitlines():
                  if "==" not in line or line[0].isspace() or line.startswith("#"):
                      continue
                  package, remainder = line.split("==", 1)
                  result[package.lower().replace("_", "-")] = (
                      remainder.split()[0].rstrip("\\")
                  )
              return result

          runtime = pins("requirements.lock")
          development = pins("requirements-dev.lock")
          mismatches = {
              package: (version, development.get(package))
              for package, version in runtime.items()
              if development.get(package) != version
          }
          assert not mismatches, mismatches
          PY
      - name: Verify Python dependency integrity and advisories
        working-directory: backend
        run: |
          pip check
          python -m pip_audit --require-hashes -r requirements.lock
      - name: Lint backend
        working-directory: backend
        run: ruff check .
      - name: Test backend
        working-directory: backend
        run: pytest
      - name: Verify migration head and model drift
        working-directory: backend
        run: |
          alembic heads
          alembic check
      - name: Verify production database preflight
        working-directory: backend
        env:
          ENVIRONMENT: production
          SUPABASE_URL: https://ci-fixture.supabase.co
          PGPASSWORD: postgres
        run: |
          alembic upgrade head
          psql -h 127.0.0.1 -U postgres -d mynutri_test_ci -v ON_ERROR_STOP=1 -c \
            "INSERT INTO principal (id,auth_user_id,email,display_name,role,status,created_at,updated_at)
             VALUES ('00000000-0000-0000-0000-000000000001','10000000-0000-0000-0000-000000000001',
             'admin.ci@example.test','CI Admin','admin','active',now(),now()) ON CONFLICT (id) DO UPDATE SET
             auth_user_id=EXCLUDED.auth_user_id,email=EXCLUDED.email,role='admin',status='active',updated_at=now();"
          python -m app.db.preflight
      - name: Check migration SQL
        working-directory: backend
        run: alembic upgrade head --sql
      - name: Plan 026 - Build Backend image
        timeout-minutes: 10
        run: docker build --tag "mynutri-backend:plan026-${GITHUB_SHA}" backend
      - name: Plan 026 - Verify configured image user
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          image="mynutri-backend:plan026-${GITHUB_SHA}"
          if ! configured_user="$(timeout --signal=KILL 30s docker image inspect --format '{{.Config.User}}' "$image")"; then
            echo "Plan 026 failed: image user inspection did not complete."
            exit 1
          fi
          if [[ -z "$configured_user" ]]; then
            echo "Plan 026 failed: the image has no configured runtime user."
            exit 1
          fi
          if [[ "$configured_user" == "root" || "$configured_user" == "0" || "$configured_user" == "0:0" ]]; then
            echo "Plan 026 failed: the image is configured to run as root."
            exit 1
          fi
          if [[ "$configured_user" != "10001:10001" ]]; then
            echo "Plan 026 failed: expected configured user 10001:10001, got $configured_user."
            exit 1
          fi
          echo "Plan 026 configured image user: $configured_user"
      - name: Plan 026 - Verify runtime UID and GID
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          image="mynutri-backend:plan026-${GITHUB_SHA}"
          if ! runtime_uid="$(timeout --signal=KILL 30s docker run --rm --entrypoint /usr/bin/id "$image" -u)"; then
            echo "Plan 026 failed: runtime UID inspection did not complete."
            exit 1
          fi
          if ! runtime_gid="$(timeout --signal=KILL 30s docker run --rm --entrypoint /usr/bin/id "$image" -g)"; then
            echo "Plan 026 failed: runtime GID inspection did not complete."
            exit 1
          fi
          if [[ "$runtime_uid" != "10001" ]]; then
            echo "Plan 026 failed: expected runtime UID 10001, got $runtime_uid."
            exit 1
          fi
          if [[ "$runtime_gid" != "10001" ]]; then
            echo "Plan 026 failed: expected runtime GID 10001, got $runtime_gid."
            exit 1
          fi
          echo "Plan 026 runtime identity: UID $runtime_uid, GID $runtime_gid"
      - name: Plan 026 - Verify runtime filesystem permissions
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          image="mynutri-backend:plan026-${GITHUB_SHA}"
          if ! app_permission="$(timeout --signal=KILL 30s docker run --rm --entrypoint /bin/sh "$image" \
            -c 'if touch /app/.plan026-write-probe 2>/dev/null; then rm -f /app/.plan026-write-probe; printf writable; else printf readonly; fi')"; then
            echo "Plan 026 failed: /app permission inspection did not complete."
            exit 1
          fi
          if [[ "$app_permission" != "readonly" ]]; then
            echo "Plan 026 failed: runtime user can write under /app."
            exit 1
          fi

          if ! timeout --signal=KILL 30s docker run --rm --entrypoint /bin/sh "$image" \
            -c 'probe="$(mktemp /tmp/plan026.XXXXXX)" && test -f "$probe" && rm -f "$probe"'; then
            echo "Plan 026 failed: runtime user cannot use the standard /tmp directory."
            exit 1
          fi
          echo "Plan 026 filesystem permissions: /app read-only, /tmp writable"
      - name: Plan 026 - Start image and verify health
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          image="mynutri-backend:plan026-${GITHUB_SHA}"
          container="plan026-backend-smoke"

          sanitized_logs() {
            docker logs "$container" 2>&1 | tail -n 200 | \
              sed -E 's#(://)[^/@[:space:]]+:[^/@[:space:]]+@#\1***:***@#g' || true
          }
          fail_smoke() {
            echo "Plan 026 failed: $1"
            sanitized_logs
            exit 1
          }

          if ! timeout --signal=KILL 30s docker run --detach \
            --name "$container" \
            --publish 127.0.0.1:18000:8000 \
            --env ENVIRONMENT=ci \
            --env DATABASE_URL=postgresql+psycopg://fixture:fixture@127.0.0.1:1/fixture \
            --env SUPABASE_URL=https://ci-fixture.supabase.co \
            --env SUPABASE_JWT_AUDIENCE=authenticated \
            --env CALENDAR_TIMEZONE=Asia/Riyadh \
            "$image" >/tmp/plan026-container-id; then
            fail_smoke "the container did not start."
          fi

          health_status=""
          for attempt in {1..30}; do
            health_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 2 http://127.0.0.1:18000/health || true)"
            if [[ "$health_status" == "200" ]]; then
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container" 2>/dev/null || true)" != "true" ]]; then
              fail_smoke "the container exited before becoming healthy."
            fi
            sleep 2
          done
          if [[ "$health_status" != "200" ]]; then
            fail_smoke "the bounded /health poll did not return HTTP 200."
          fi

          process_uid="$(timeout --signal=KILL 15s docker exec "$container" \
            /bin/sh -c "awk '/^Uid:/ {print \$2}' /proc/1/status")" || \
            fail_smoke "could not inspect the running process UID."
          process_gid="$(timeout --signal=KILL 15s docker exec "$container" \
            /bin/sh -c "awk '/^Gid:/ {print \$2}' /proc/1/status")" || \
            fail_smoke "could not inspect the running process GID."
          if [[ "$process_uid" != "10001" ]]; then
            fail_smoke "expected running process UID 10001, got $process_uid."
          fi
          if [[ "$process_gid" != "10001" ]]; then
            fail_smoke "expected running process GID 10001, got $process_gid."
          fi
          if ! docker inspect --format '{{.State.Running}}' "$container" | grep -qx 'true'; then
            fail_smoke "the container stopped after its health response."
          fi

          container_logs="$(docker logs "$container" 2>&1)"
          if grep -Eiq 'permission denied|PermissionError' <<<"$container_logs"; then
            fail_smoke "the healthy container logged a permission error."
          fi
          echo "Plan 026 health smoke: HTTP 200, PID 1 UID $process_uid, GID $process_gid"
      - name: Plan 026 - Clean up image smoke
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          docker rm --force plan026-backend-smoke >/dev/null 2>&1 || true
          if docker inspect plan026-backend-smoke >/dev/null 2>&1; then
            echo "Plan 026 failed: the smoke container survived cleanup."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Audit all dependencies
        working-directory: frontend
        run: npm audit
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mynutri_e2e_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mynutri_e2e_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mynutri_e2e_ci
      SUPABASE_URL: http://127.0.0.1:8765
      SUPABASE_JWT_AUDIENCE: authenticated
      CALENDAR_TIMEZONE: Asia/Riyadh
      SNAPSHOT_V3_WRITER_ENABLED: "true"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:8765
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: e2e-public-key
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_API_URL: http://127.0.0.1:8000
      PLAYWRIGHT_SUPABASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Backend
        run: |
          pip install --require-hashes -r backend/requirements-dev.lock
          pip install --no-deps --no-build-isolation -e ./backend
      - name: Install Frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Upgrade disposable database
        working-directory: backend
        run: alembic upgrade head
      - name: Provision test Principal
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -U postgres -d mynutri_e2e_ci -v ON_ERROR_STOP=1
          -c "INSERT INTO principal
          (id,auth_user_id,email,display_name,role,status,created_at,updated_at) VALUES
          ('00000000-0000-0000-0000-000000000001',
          '10000000-0000-0000-0000-000000000001','admin.e2e@example.test',
          'مشرف الاختبار','admin','active',now(),now());"
      - name: Start application services
        run: |
          python backend/scripts/e2e_supabase_auth.py > /tmp/mynutri-auth.log 2>&1 &
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/mynutri-api.log 2>&1 &
          cd ../frontend
          npm run build
          setsid npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/mynutri-web.log 2>&1 &
          echo "$!" > /tmp/mynutri-web.pgid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8765/health >/dev/null &&
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null &&
            curl --fail --silent http://127.0.0.1:3000/profile >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/mynutri-api.log /tmp/mynutri-web.log
          exit 1
      - name: Run complete Playwright suite
        working-directory: frontend
        run: npm run test:e2e -- --project=foods-chromium
      - name: Verify static-shell PWA isolation
        working-directory: frontend
        run: npx playwright test e2e/pwa-shell.spec.ts --project=pwa-chromium
      - name: Run development StrictMode signal smoke
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_SKIP_GLOBAL_SETUP: "1"
        run: |
          set -euo pipefail

          if [[ ! -s /tmp/mynutri-web.pgid ]]; then
            echo "Production frontend process-group file is missing."
            exit 1
          fi
          production_pgid="$(cat /tmp/mynutri-web.pgid)"
          if [[ ! "$production_pgid" =~ ^[0-9]+$ ]]; then
            echo "Invalid production frontend process group: $production_pgid"
            exit 1
          fi

          kill -TERM -- "-${production_pgid}" 2>/dev/null || true
          for attempt in {1..30}; do
            if ! kill -0 -- "-${production_pgid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 -- "-${production_pgid}" 2>/dev/null; then
            kill -KILL -- "-${production_pgid}" 2>/dev/null || true
          fi
          rm -f /tmp/mynutri-web.pgid

          production_stopped=0
          for attempt in {1..30}; do
            if ! curl --silent --output /dev/null --max-time 1 http://127.0.0.1:3000/auth/login; then
              production_stopped=1
              break
            fi
            sleep 1
          done
          if [[ "$production_stopped" -ne 1 ]]; then
            echo "Production frontend still owns port 3000."
            cat /tmp/mynutri-web.log
            exit 1
          fi

          setsid npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/mynutri-web-dev.log 2>&1 &
          dev_pgid="$!"
          if [[ ! "$dev_pgid" =~ ^[0-9]+$ ]]; then
            echo "Invalid development frontend process group: $dev_pgid"
            exit 1
          fi
          cleanup_dev() {
            kill -TERM -- "-${dev_pgid}" 2>/dev/null || true
            for attempt in {1..15}; do
              if ! kill -0 -- "-${dev_pgid}" 2>/dev/null; then
                return
              fi
              sleep 1
            done
            kill -KILL -- "-${dev_pgid}" 2>/dev/null || true
          }
          trap cleanup_dev EXIT

          dev_ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/auth/login >/dev/null; then
              dev_ready=1
              break
            fi
            sleep 2
          done
          if [[ "$dev_ready" -ne 1 ]]; then
            cat /tmp/mynutri-web-dev.log
            exit 1
          fi

          if ! npx playwright test e2e/auth-session-isolation.spec.ts \
            --project=foods-chromium \
            --grep "@strictmode"; then
            cat /tmp/mynutri-web-dev.log
            exit 1
          fi

  plan020-provider-acceptance:
    name: Plan 020 provider acceptance
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_API_URL: http://127.0.0.1:65534
      PLAYWRIGHT_SKIP_GLOBAL_SETUP: "1"
      PLAN020_RECOVERY_EXPIRY_SECONDS: "20"
      PLAN020_PROJECT_ID: mynutri-plan020-provider-ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0
      - name: Install provider acceptance dependencies
        run: |
          pip install --require-hashes -r backend/requirements-dev.lock
          pip install --no-deps --no-build-isolation -e ./backend
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Start isolated local Supabase Auth and Mailpit
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          network_name="plan020-loopback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker network create \
            -o com.docker.network.bridge.host_binding_ipv4=127.0.0.1 \
            "$network_name" >/dev/null
          touch /tmp/plan020-network-created
          echo "PLAN020_DOCKER_NETWORK=$network_name" >> "$GITHUB_ENV"

          touch /tmp/plan020-stack-attempted
          if ! supabase start --network-id "$network_name" > /tmp/plan020-supabase-start.log 2>&1; then
            echo "The isolated local Supabase stack failed to start."
            docker ps -a --format '{{.Names}} {{.Status}}' | grep '^supabase_' | sed -E 's/[[:space:]]+/ /g'
            exit 1
          fi
          supabase status -o env > /tmp/plan020-supabase.env
          chmod 600 /tmp/plan020-supabase.env
          source /tmp/plan020-supabase.env

          public_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          admin_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          mailpit_url="${MAILPIT_URL:-http://127.0.0.1:54324}"
          provider_url="${API_URL:-}"
          database_url_raw="${DB_URL:-}"
          if [[ -z "${API_URL:-}" || -z "${DB_URL:-}" || -z "$public_key" || -z "$admin_key" ]]; then
            echo "The isolated stack did not expose every required local runtime value."
            exit 1
          fi

          echo "::add-mask::$public_key"
          echo "::add-mask::$admin_key"
          if [[ -n "${ANON_KEY:-}" ]]; then echo "::add-mask::$ANON_KEY"; fi
          if [[ -n "${SERVICE_ROLE_KEY:-}" ]]; then echo "::add-mask::$SERVICE_ROLE_KEY"; fi
          if [[ -n "${JWT_SECRET:-}" ]]; then echo "::add-mask::$JWT_SECRET"; fi
          echo "::add-mask::$DB_URL"

          database_url="${DB_URL/postgresql:\/\//postgresql+psycopg:\/\/}"
          echo "::add-mask::$database_url"
          unset SECRET_KEY SERVICE_ROLE_KEY DB_URL DATABASE_URL JWT_SECRET ANON_KEY PUBLISHABLE_KEY API_URL MAILPIT_URL

          auth_ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 2 "$provider_url/auth/v1/health" >/dev/null &&
               pg_isready -d "$database_url_raw" >/dev/null 2>&1 &&
               curl --fail --silent --max-time 2 "$mailpit_url/api/v1/info" >/dev/null; then
              auth_ready=1
              break
            fi
            sleep 2
          done
          if [[ "$auth_ready" -ne 1 ]]; then
            echo "Auth, Postgres, or Mailpit did not reach a healthy local state."
            docker ps -a --format '{{.Names}} {{.Status}}' | grep '^supabase_' | sed -E 's/[[:space:]]+/ /g'
            exit 1
          fi
      - name: Apply application migrations to disposable local Postgres
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/plan020-supabase.env
          database_url="${DB_URL/postgresql:\/\//postgresql+psycopg:\/\/}"
          unset SECRET_KEY SERVICE_ROLE_KEY DB_URL DATABASE_URL JWT_SECRET ANON_KEY PUBLISHABLE_KEY API_URL MAILPIT_URL
          DATABASE_URL="$database_url" alembic upgrade head
      - name: Build and start loopback application
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/plan020-supabase.env
          provider_url="$API_URL"
          provider_public_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          unset SECRET_KEY SERVICE_ROLE_KEY DB_URL DATABASE_URL JWT_SECRET ANON_KEY PUBLISHABLE_KEY API_URL MAILPIT_URL
          export NEXT_PUBLIC_API_URL=http://127.0.0.1:65534
          export NEXT_PUBLIC_SUPABASE_URL="$provider_url"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$provider_public_key"
          npm run build > /tmp/plan020-web-build.log 2>&1
          setsid npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/plan020-web.log 2>&1 &
          echo "$!" > /tmp/plan020-web.pgid
          app_ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/auth/forgot-password >/dev/null; then
              app_ready=1
              break
            fi
            sleep 2
          done
          if [[ "$app_ready" -ne 1 ]]; then
            echo "The loopback application did not become ready."
            exit 1
          fi
      - name: Discover exact provider acceptance suite
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/plan020-supabase.env
          provider_url="$API_URL"
          provider_public_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          provider_admin_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          provider_mailpit_url="${MAILPIT_URL:-http://127.0.0.1:54324}"
          unset SECRET_KEY SERVICE_ROLE_KEY DB_URL DATABASE_URL JWT_SECRET ANON_KEY PUBLISHABLE_KEY API_URL MAILPIT_URL
          export PLAN020_SUPABASE_URL="$provider_url"
          export PLAN020_SUPABASE_ANON_KEY="$provider_public_key"
          export PLAN020_SUPABASE_SERVICE_ROLE_KEY="$provider_admin_key"
          export PLAN020_MAILPIT_URL="$provider_mailpit_url"
          discovery="$(npx playwright test --project=password-recovery-provider --list)"
          provider_count="$(printf '%s\n' "$discovery" |
            awk '/@plan020-provider/ { count += 1 } END { print count + 0 }')"
          total_count="$(printf '%s\n' "$discovery" | awk '/^Total:/ { print $2 }')"
          total_count="${total_count:-0}"
          if [[ "$provider_count" -ne 7 || "$total_count" -ne 7 ]]; then
            echo "Expected exactly 7 total and tagged Plan 020 provider tests; discovered $total_count total and $provider_count tagged."
            exit 1
          fi
          echo "Discovered exactly 7 isolated Plan 020 provider tests."
      - name: Run isolated real-provider acceptance
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/plan020-supabase.env
          provider_url="$API_URL"
          provider_public_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          provider_admin_key="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          provider_mailpit_url="${MAILPIT_URL:-http://127.0.0.1:54324}"
          unset SECRET_KEY SERVICE_ROLE_KEY DB_URL DATABASE_URL JWT_SECRET ANON_KEY PUBLISHABLE_KEY API_URL MAILPIT_URL
          export PLAN020_SUPABASE_URL="$provider_url"
          export PLAN020_SUPABASE_ANON_KEY="$provider_public_key"
          export PLAN020_SUPABASE_SERVICE_ROLE_KEY="$provider_admin_key"
          export PLAN020_MAILPIT_URL="$provider_mailpit_url"
          npx playwright test --project=password-recovery-provider
      - name: Clean up isolated provider resources
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          cleanup_failed=0

          if [[ -s /tmp/plan020-web.pgid ]]; then
            web_pgid="$(cat /tmp/plan020-web.pgid)"
            if [[ "$web_pgid" =~ ^[0-9]+$ ]]; then
              kill -TERM -- "-${web_pgid}" 2>/dev/null
              for attempt in {1..15}; do
                if ! kill -0 -- "-${web_pgid}" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              if kill -0 -- "-${web_pgid}" 2>/dev/null; then
                kill -KILL -- "-${web_pgid}" 2>/dev/null
              fi
              if kill -0 -- "-${web_pgid}" 2>/dev/null; then
                echo "The loopback application process group survived cleanup."
                cleanup_failed=1
              fi
            else
              echo "The loopback application process marker was invalid."
              cleanup_failed=1
            fi
          fi

          if [[ -f /tmp/plan020-stack-attempted ]]; then
            supabase stop --no-backup >/dev/null 2>&1
            remaining_containers="$(docker ps -aq --filter "label=com.supabase.cli.project=$PLAN020_PROJECT_ID")"
            remaining_volumes="$(docker volume ls -q --filter "label=com.supabase.cli.project=$PLAN020_PROJECT_ID")"
            if [[ -n "$remaining_containers" || -n "$remaining_volumes" ]]; then
              echo "Disposable Supabase containers or volumes survived cleanup."
              cleanup_failed=1
            fi
          fi

          if [[ -f /tmp/plan020-network-created && -n "${PLAN020_DOCKER_NETWORK:-}" ]]; then
            docker network rm "$PLAN020_DOCKER_NETWORK" >/dev/null 2>&1
            if docker network inspect "$PLAN020_DOCKER_NETWORK" >/dev/null 2>&1; then
              echo "The disposable loopback Docker network survived cleanup."
              cleanup_failed=1
            fi
          fi
          rm -f /tmp/plan020-supabase.env /tmp/plan020-supabase-start.log
          rm -f /tmp/plan020-web-build.log /tmp/plan020-web.log /tmp/plan020-web.pgid
          rm -f /tmp/plan020-network-created /tmp/plan020-stack-attempted
          rm -rf supabase/.temp supabase/.branches
          rm -rf frontend/test-results frontend/playwright-report frontend/e2e/.auth
          if [[ -e /tmp/plan020-supabase.env || -e /tmp/plan020-supabase-start.log ||
                -e /tmp/plan020-web-build.log || -e /tmp/plan020-web.log ||
                -e /tmp/plan020-web.pgid || -e /tmp/plan020-network-created ||
                -e /tmp/plan020-stack-attempted || -e supabase/.temp ||
                -e supabase/.branches || -e frontend/test-results ||
                -e frontend/playwright-report || -e frontend/e2e/.auth ]]; then
            echo "A temporary provider, web, Playwright, marker, or CLI path survived cleanup."
            cleanup_failed=1
          fi
          exit "$cleanup_failed"
