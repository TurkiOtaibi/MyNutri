name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXPECTED_FUNCTIONAL_PLAYWRIGHT_TESTS: "494"
  EXPECTED_BACKEND_TESTS: "1802"
  EXPECTED_BACKEND_UNIT_TESTS: "1385"
  EXPECTED_BACKEND_POSTGRES_TESTS: "417"

jobs:
  backend-static:
    name: Backend static, audit, migration and container gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mynutri_test_static_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mynutri_test_static_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mynutri_test_static_ci
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mynutri_test_static_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Collect deterministic backend test partition plan
        working-directory: backend
        run: >-
          pytest -p ci_pytest_partition
          --ci-backend-partition plan
          --ci-backend-evidence backend-test-plan.json
          --collect-only -q
      - name: Upload backend test partition plan
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-plan
          path: backend/backend-test-plan.json
          if-no-files-found: error
      - name: Verify Python lock drift and shared versions
        working-directory: backend
        run: |
          pip-compile --allow-unsafe --all-build-deps --generate-hashes --resolver=backtracking --strip-extras --output-file=requirements.lock pyproject.toml
          pip-compile --allow-unsafe --all-build-deps --extra=dev --generate-hashes --resolver=backtracking --strip-extras --output-file=requirements-dev.lock pyproject.toml
          git diff --exit-code -- requirements.lock requirements-dev.lock
          python - <<'PY'
          from pathlib import Path

          def pins(name: str) -> dict[str, str]:
              result = {}
              for line in Path(name).read_text(encoding="utf-8").splitlines():
                  if "==" not in line or line[0].isspace() or line.startswith("#"):
                      continue
                  package, remainder = line.split("==", 1)
                  result[package.lower().replace("_", "-")] = (
                      remainder.split()[0].rstrip("\\")
                  )
              return result

          runtime = pins("requirements.lock")
          development = pins("requirements-dev.lock")
          mismatches = {
              package: (version, development.get(package))
              for package, version in runtime.items()
              if development.get(package) != version
          }
          assert not mismatches, mismatches
          PY
      - name: Verify Python dependency integrity and advisories
        working-directory: backend
        run: |
          pip check
          python -m pip_audit --require-hashes -r requirements.lock
          python -m pip_audit --require-hashes -r requirements-dev.lock
      - name: Lint backend
        working-directory: backend
        run: ruff check .
      - name: Verify migration head and model drift
        working-directory: backend
        run: |
          alembic heads
          python -m scripts.bootstrap_disposable_database --keep-admin
          alembic check
      - name: Verify production database preflight
        working-directory: backend
        env:
          ENVIRONMENT: production
          PGPASSWORD: postgres
        run: |
          alembic upgrade head
          python -m app.db.preflight
      - name: Check migration SQL
        working-directory: backend
        run: alembic upgrade head --sql
      - name: Plan 026 - Build Backend image
        timeout-minutes: 10
        run: docker build --tag "mynutri-backend:plan026-${GITHUB_SHA}" backend
      - name: Plan 026 - Verify configured image user
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          image="mynutri-backend:plan026-${GITHUB_SHA}"
          if ! configured_user="$(timeout --signal=KILL 30s docker image inspect --format '{{.Config.User}}' "$image")"; then
            echo "Plan 026 failed: image user inspection did not complete."
            exit 1
          fi
          if [[ -z "$configured_user" ]]; then
            echo "Plan 026 failed: the image has no configured runtime user."
            exit 1
          fi
          if [[ "$configured_user" == "root" || "$configured_user" == "0" || "$configured_user" == "0:0" ]]; then
            echo "Plan 026 failed: the image is configured to run as root."
            exit 1
          fi
          if [[ "$configured_user" != "10001:10001" ]]; then
            echo "Plan 026 failed: expected configured user 10001:10001, got $configured_user."
            exit 1
          fi
          echo "Plan 026 configured image user: $configured_user"
      - name: Plan 026 - Verify runtime UID and GID
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          image="mynutri-backend:plan026-${GITHUB_SHA}"
          if ! runtime_uid="$(timeout --signal=KILL 30s docker run --rm --entrypoint /usr/bin/id "$image" -u)"; then
            echo "Plan 026 failed: runtime UID inspection did not complete."
            exit 1
          fi
          if ! runtime_gid="$(timeout --signal=KILL 30s docker run --rm --entrypoint /usr/bin/id "$image" -g)"; then
            echo "Plan 026 failed: runtime GID inspection did not complete."
            exit 1
          fi
          if [[ "$runtime_uid" != "10001" ]]; then
            echo "Plan 026 failed: expected runtime UID 10001, got $runtime_uid."
            exit 1
          fi
          if [[ "$runtime_gid" != "10001" ]]; then
            echo "Plan 026 failed: expected runtime GID 10001, got $runtime_gid."
            exit 1
          fi
          echo "Plan 026 runtime identity: UID $runtime_uid, GID $runtime_gid"
      - name: Plan 026 - Verify runtime filesystem permissions
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          image="mynutri-backend:plan026-${GITHUB_SHA}"
          if ! app_permission="$(timeout --signal=KILL 30s docker run --rm --entrypoint /bin/sh "$image" \
            -c 'if touch /app/.plan026-write-probe 2>/dev/null; then rm -f /app/.plan026-write-probe; printf writable; else printf readonly; fi')"; then
            echo "Plan 026 failed: /app permission inspection did not complete."
            exit 1
          fi
          if [[ "$app_permission" != "readonly" ]]; then
            echo "Plan 026 failed: runtime user can write under /app."
            exit 1
          fi

          if ! timeout --signal=KILL 30s docker run --rm --entrypoint /bin/sh "$image" \
            -c 'probe="$(mktemp /tmp/plan026.XXXXXX)" && test -f "$probe" && rm -f "$probe"'; then
            echo "Plan 026 failed: runtime user cannot use the standard /tmp directory."
            exit 1
          fi
          echo "Plan 026 filesystem permissions: /app read-only, /tmp writable"
      - name: Plan 026 - Start image and verify health
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          image="mynutri-backend:plan026-${GITHUB_SHA}"
          container="plan026-backend-smoke"

          sanitized_logs() {
            docker logs "$container" 2>&1 | tail -n 200 | \
              sed -E 's#(://)[^/@[:space:]]+:[^/@[:space:]]+@#\1***:***@#g' || true
          }
          fail_smoke() {
            echo "Plan 026 failed: $1"
            sanitized_logs
            exit 1
          }

          if ! timeout --signal=KILL 30s docker run --detach \
            --name "$container" \
            --publish 127.0.0.1:18000:8000 \
            --env ENVIRONMENT=ci \
            --env DATABASE_URL=postgresql+psycopg://fixture:fixture@127.0.0.1:1/fixture \
            --env CALENDAR_TIMEZONE=Asia/Riyadh \
            "$image" >/tmp/plan026-container-id; then
            fail_smoke "the container did not start."
          fi

          health_status=""
          for attempt in {1..30}; do
            health_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 2 http://127.0.0.1:18000/health || true)"
            if [[ "$health_status" == "200" ]]; then
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container" 2>/dev/null || true)" != "true" ]]; then
              fail_smoke "the container exited before becoming healthy."
            fi
            sleep 2
          done
          if [[ "$health_status" != "200" ]]; then
            fail_smoke "the bounded /health poll did not return HTTP 200."
          fi

          process_uid="$(timeout --signal=KILL 15s docker exec "$container" \
            /bin/sh -c "awk '/^Uid:/ {print \$2}' /proc/1/status")" || \
            fail_smoke "could not inspect the running process UID."
          process_gid="$(timeout --signal=KILL 15s docker exec "$container" \
            /bin/sh -c "awk '/^Gid:/ {print \$2}' /proc/1/status")" || \
            fail_smoke "could not inspect the running process GID."
          if [[ "$process_uid" != "10001" ]]; then
            fail_smoke "expected running process UID 10001, got $process_uid."
          fi
          if [[ "$process_gid" != "10001" ]]; then
            fail_smoke "expected running process GID 10001, got $process_gid."
          fi
          if ! docker inspect --format '{{.State.Running}}' "$container" | grep -qx 'true'; then
            fail_smoke "the container stopped after its health response."
          fi

          container_logs="$(docker logs "$container" 2>&1)"
          if grep -Eiq 'permission denied|PermissionError' <<<"$container_logs"; then
            fail_smoke "the healthy container logged a permission error."
          fi
          echo "Plan 026 health smoke: HTTP 200, PID 1 UID $process_uid, GID $process_gid"
      - name: Plan 026 - Clean up image smoke
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          docker rm --force plan026-backend-smoke >/dev/null 2>&1 || true
          if docker inspect plan026-backend-smoke >/dev/null 2>&1; then
            echo "Plan 026 failed: the smoke container survived cleanup."
            exit 1
          fi

  backend-unit:
    name: Backend SQLite, unit and security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Test SQLite, unit and security partition
        working-directory: backend
        run: >-
          pytest -p ci_pytest_partition
          --ci-backend-partition unit
          --ci-backend-evidence backend-unit-results.json
          --durations=20
      - name: Upload backend unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence-unit
          path: backend/backend-unit-results.json
          if-no-files-found: error

  backend-postgres:
    name: Backend PostgreSQL tests shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mynutri_test_backend_${{ matrix.shard }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mynutri_test_backend_${{ matrix.shard }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mynutri_test_backend_${{ matrix.shard }}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mynutri_test_backend_${{ matrix.shard }}
      BACKEND_POSTGRES_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install backend
        working-directory: backend
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Test isolated PostgreSQL partition
        working-directory: backend
        run: >-
          pytest -p ci_pytest_partition
          --ci-backend-partition "postgres-${BACKEND_POSTGRES_SHARD}"
          --ci-backend-evidence "backend-postgres-${BACKEND_POSTGRES_SHARD}-results.json"
          --durations=20
      - name: Upload backend PostgreSQL test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence-postgres-${{ matrix.shard }}
          path: backend/backend-postgres-${{ matrix.shard }}-results.json
          if-no-files-found: error

  backend-summary:
    name: backend
    if: always()
    needs:
      - backend-static
      - backend-unit
      - backend-postgres
    runs-on: ubuntu-latest
    steps:
      - name: Download backend test evidence
        id: backend_evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: backend-test-*
          path: backend-test-evidence
      - name: Verify backend gates and complete test execution
        shell: bash
        env:
          STATIC_RESULT: ${{ needs['backend-static'].result }}
          UNIT_RESULT: ${{ needs['backend-unit'].result }}
          POSTGRES_RESULT: ${{ needs['backend-postgres'].result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          from collections import Counter
          from pathlib import Path

          evidence_root = Path("backend-test-evidence")
          errors = []
          for job_name, result in (
              ("backend-static", os.environ["STATIC_RESULT"]),
              ("backend-unit", os.environ["UNIT_RESULT"]),
              ("backend-postgres", os.environ["POSTGRES_RESULT"]),
          ):
              if result != "success":
                  errors.append(f"Required job {job_name} finished with {result}.")

          def one_file(name):
              paths = list(evidence_root.rglob(name))
              if len(paths) != 1:
                  errors.append(f"Expected one {name} artifact; found {len(paths)}.")
                  return None
              return paths[0]

          plan_path = one_file("backend-test-plan.json")
          result_paths = {
              "unit": one_file("backend-unit-results.json"),
              "postgres-1": one_file("backend-postgres-1-results.json"),
              "postgres-2": one_file("backend-postgres-2-results.json"),
          }

          if plan_path is not None:
              plan = json.loads(plan_path.read_text(encoding="utf-8"))
              full = plan.get("full", [])
              partitions = plan.get("partitions", {})
              allowed_skips = set(plan.get("allowedSkips", []))
              expected = plan.get("expected", {})
              expected_values = {
                  "full": int(os.environ["EXPECTED_BACKEND_TESTS"]),
                  "unit": int(os.environ["EXPECTED_BACKEND_UNIT_TESTS"]),
                  "postgres": int(os.environ["EXPECTED_BACKEND_POSTGRES_TESTS"]),
                  "postgresShards": 2,
              }
              if expected != expected_values:
                  errors.append(f"Backend plan expectations differ: {expected} != {expected_values}.")
              if len(full) != len(set(full)):
                  errors.append("The unfiltered backend collection contains duplicate node IDs.")
              if set(partitions) != set(result_paths):
                  errors.append(
                      f"Expected partitions {sorted(result_paths)}; found {sorted(partitions)}."
                  )

              assigned = [
                  nodeid
                  for partition in result_paths
                  for nodeid in partitions.get(partition, [])
              ]
              assigned_counts = Counter(assigned)
              assigned_duplicates = [
                  nodeid for nodeid, count in assigned_counts.items() if count != 1
              ]
              assigned_set = set(assigned)
              full_set = set(full)
              if assigned_set != full_set or assigned_duplicates:
                  errors.append(
                      "Backend partition union differs from the unfiltered collection: "
                      f"missing={len(full_set - assigned_set)}, "
                      f"unexpected={len(assigned_set - full_set)}, "
                      f"duplicates={len(assigned_duplicates)}."
                  )

              postgres_count = sum(
                  len(partitions.get(name, [])) for name in ("postgres-1", "postgres-2")
              )
              actual_counts = {
                  "full": len(full),
                  "unit": len(partitions.get("unit", [])),
                  "postgres": postgres_count,
              }
              for name in ("full", "unit", "postgres"):
                  if actual_counts[name] != expected_values[name]:
                      errors.append(
                          f"Backend {name} count={actual_counts[name]}, "
                          f"expected={expected_values[name]}."
                      )

              execution_counts = Counter()
              observed_skips = set()
              for partition, result_path in result_paths.items():
                  if result_path is None:
                      continue
                  result = json.loads(result_path.read_text(encoding="utf-8"))
                  if result.get("partition") != partition:
                      errors.append(
                          f"Evidence for {partition} reports partition={result.get('partition')}."
                      )
                  selected = result.get("selected", [])
                  executed = result.get("executed", [])
                  if selected != partitions.get(partition, []):
                      errors.append(f"{partition} selection differs from the deterministic plan.")
                  if set(executed) != set(selected) or len(executed) != len(selected):
                      errors.append(
                          f"{partition} execution differs from selection: "
                          f"selected={len(selected)}, executed={len(executed)}."
                      )
                  if result.get("errors"):
                      errors.append(f"{partition} verifier errors: {result['errors']}.")
                  execution_counts.update(executed)
                  observed_skips.update(result.get("skipped", []))
                  print(
                      f"Backend {partition}: assigned={len(partitions.get(partition, []))}, "
                      f"executed={len(executed)}, skipped={len(result.get('skipped', []))}"
                  )

              execution_duplicates = [
                  nodeid for nodeid, count in execution_counts.items() if count != 1
              ]
              execution_set = set(execution_counts)
              if execution_set != full_set or execution_duplicates:
                  errors.append(
                      "Backend execution union differs from the unfiltered collection: "
                      f"missing={len(full_set - execution_set)}, "
                      f"unexpected={len(execution_set - full_set)}, "
                      f"duplicates={len(execution_duplicates)}."
                  )
              if observed_skips != allowed_skips:
                  errors.append(
                      f"Backend skip set differs: actual={sorted(observed_skips)}, "
                      f"allowed={sorted(allowed_skips)}."
                  )

              print(f"Backend unfiltered collection: {len(full)} tests")
              print(
                  f"Backend assigned union: {len(assigned_set)} tests; "
                  f"duplicates: {len(assigned_duplicates)}"
              )
              print(
                  f"Backend executed union: {len(execution_set)} tests; "
                  f"duplicates: {len(execution_duplicates)}"
              )
              print(f"Backend allowed skips executed: {len(observed_skips)}")

          if errors:
              print("Backend aggregation failed:", file=sys.stderr)
              for error in errors:
                  print(f"- {error}", file=sys.stderr)
              sys.exit(1)

          print("All backend gates passed and every collected backend test executed exactly once.")
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Backend contract export dependencies
        run: pip install --require-hashes -r backend/requirements.lock
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --prefer-offline
      - name: Audit all dependencies
        working-directory: frontend
        # Fails on any advisory except reviewed, unexpired entries in scripts/audit-exceptions.json.
        run: npm run audit:full
      - name: Verify generated API contract drift
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code -- openapi.json lib/generated/openapi.ts
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E functional shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mynutri_e2e_ci_${{ matrix.shard }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mynutri_e2e_ci_${{ matrix.shard }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLAYWRIGHT_DISPOSABLE_DATABASE: mynutri_e2e_ci_${{ matrix.shard }}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mynutri_e2e_ci_${{ matrix.shard }}
      CALENDAR_TIMEZONE: Asia/Riyadh
      NEXT_PUBLIC_E2E_INSPECTION: "true"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Backend
        run: |
          pip install --require-hashes -r backend/requirements.lock
          pip install --no-deps --no-build-isolation -e ./backend
      - name: Install Frontend and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --prefer-offline
          npx playwright install --with-deps --only-shell chromium
      - name: Collect deterministic functional shard evidence
        working-directory: frontend
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: "4"
        run: |
          set -euo pipefail
          evidence_dir="shard-evidence/${SHARD_INDEX}"
          mkdir -p "$evidence_dir"

          npx playwright test --project=foods-chromium --list
          cp test-results/foods-results.json "$evidence_dir/full-collection.json"

          npx playwright test --project=foods-chromium \
            --shard="${SHARD_INDEX}/${SHARD_TOTAL}" --list
          cp test-results/foods-results.json "$evidence_dir/assigned-collection.json"
          rm -f test-results/foods-results.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          shard_index = int(os.environ["SHARD_INDEX"])
          shard_total = int(os.environ["SHARD_TOTAL"])
          expected = int(os.environ["EXPECTED_FUNCTIONAL_PLAYWRIGHT_TESTS"])
          evidence_dir = Path("shard-evidence") / str(shard_index)
          (evidence_dir / "metadata.json").write_text(
              json.dumps(
                  {
                      "shardIndex": shard_index,
                      "shardTotal": shard_total,
                      "expectedTests": expected,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upgrade disposable database
        working-directory: backend
        run: python -m scripts.bootstrap_disposable_database
      - name: Provision test Principal
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -U postgres -d mynutri_e2e_ci_${{ matrix.shard }} -v ON_ERROR_STOP=1
          -c "INSERT INTO principal
          (id,auth_user_id,email,display_name,role,status,created_at,updated_at) VALUES
          ('00000000-0000-0000-0000-000000000001',
          '10000000-0000-0000-0000-000000000001','admin.e2e@example.test',
          'مشرف الاختبار','admin','active',now(),now());"
      - name: Start application services
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/mynutri-api.log 2>&1 &
          cd ../frontend
          npm run build
          setsid npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/mynutri-web.log 2>&1 &
          echo "$!" > /tmp/mynutri-web.pgid
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null &&
            curl --fail --silent http://127.0.0.1:3000/profile >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/mynutri-api.log /tmp/mynutri-web.log
          exit 1
      - name: Run complete assigned Playwright shard
        working-directory: frontend
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: "4"
        run: >-
          npm run test:e2e -- --project=foods-chromium
          --shard=${SHARD_INDEX}/${SHARD_TOTAL}
      - name: Capture functional shard execution evidence
        if: always()
        working-directory: frontend
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          evidence_dir="shard-evidence/${SHARD_INDEX}"
          mkdir -p "$evidence_dir"
          if [[ -f test-results/foods-results.json ]]; then
            cp test-results/foods-results.json "$evidence_dir/actual-results.json"
          fi
      - name: Run critical visual regression
        if: matrix.shard == 4
        id: critical_visual
        continue-on-error: true
        working-directory: frontend
        run: npm run test:visual
      - name: Retain critical visual failure evidence
        if: matrix.shard == 4 && steps.critical_visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: critical-visual-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/visual-regression
            frontend/playwright-report
            frontend/e2e/visual-regression/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify static-shell PWA isolation
        if: matrix.shard == 4
        id: pwa
        continue-on-error: true
        working-directory: frontend
        run: npx playwright test e2e/pwa-shell.spec.ts --project=pwa-chromium
      - name: Retain PWA failure evidence
        if: matrix.shard == 4 && steps.pwa.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pwa-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Run development StrictMode signal smoke
        if: matrix.shard == 4
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_SKIP_GLOBAL_SETUP: "1"
        run: |
          set -euo pipefail

          if [[ ! -s /tmp/mynutri-web.pgid ]]; then
            echo "Production frontend process-group file is missing."
            exit 1
          fi
          production_pgid="$(cat /tmp/mynutri-web.pgid)"
          if [[ ! "$production_pgid" =~ ^[0-9]+$ ]]; then
            echo "Invalid production frontend process group: $production_pgid"
            exit 1
          fi

          kill -TERM -- "-${production_pgid}" 2>/dev/null || true
          for attempt in {1..30}; do
            if ! kill -0 -- "-${production_pgid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 -- "-${production_pgid}" 2>/dev/null; then
            kill -KILL -- "-${production_pgid}" 2>/dev/null || true
          fi
          rm -f /tmp/mynutri-web.pgid

          production_stopped=0
          for attempt in {1..30}; do
            if ! curl --silent --output /dev/null --max-time 1 http://127.0.0.1:3000/auth/login; then
              production_stopped=1
              break
            fi
            sleep 1
          done
          if [[ "$production_stopped" -ne 1 ]]; then
            echo "Production frontend still owns port 3000."
            cat /tmp/mynutri-web.log
            exit 1
          fi

          setsid npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/mynutri-web-dev.log 2>&1 &
          dev_pgid="$!"
          if [[ ! "$dev_pgid" =~ ^[0-9]+$ ]]; then
            echo "Invalid development frontend process group: $dev_pgid"
            exit 1
          fi
          cleanup_dev() {
            kill -TERM -- "-${dev_pgid}" 2>/dev/null || true
            for attempt in {1..15}; do
              if ! kill -0 -- "-${dev_pgid}" 2>/dev/null; then
                return
              fi
              sleep 1
            done
            kill -KILL -- "-${dev_pgid}" 2>/dev/null || true
          }
          trap cleanup_dev EXIT

          dev_ready=0
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/auth/login >/dev/null; then
              dev_ready=1
              break
            fi
            sleep 2
          done
          if [[ "$dev_ready" -ne 1 ]]; then
            cat /tmp/mynutri-web-dev.log
            exit 1
          fi

          if ! npx playwright test e2e/auth-session-isolation.spec.ts \
            --project=foods-chromium \
            --grep "@strictmode"; then
            cat /tmp/mynutri-web-dev.log
            exit 1
          fi
      - name: Enforce early critical gate results
        if: always() && matrix.shard == 4
        shell: bash
        env:
          CRITICAL_VISUAL_OUTCOME: ${{ steps.critical_visual.outcome }}
          PWA_OUTCOME: ${{ steps.pwa.outcome }}
        run: |
          set -euo pipefail
          failed=0
          if [[ "$CRITICAL_VISUAL_OUTCOME" != "success" ]]; then
            echo "Critical visual regression outcome was $CRITICAL_VISUAL_OUTCOME."
            failed=1
          fi
          if [[ "$PWA_OUTCOME" != "success" ]]; then
            echo "Static-shell PWA outcome was $PWA_OUTCOME."
            failed=1
          fi
          exit "$failed"
      - name: Upload functional shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-evidence-${{ matrix.shard }}
          path: frontend/shard-evidence/${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 7

  internal-auth-acceptance:
    name: Internal auth acceptance
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ci
      INTERNAL_AUTH_ACCEPTANCE_DISPOSABLE: mynutri_test_internal_auth_ci
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:55432/mynutri_test_internal_auth_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install internal acceptance dependencies
        run: |
          pip install --require-hashes -r backend/requirements.lock
          pip install --no-deps --no-build-isolation -e ./backend
      - name: Start disposable loopback PostgreSQL
        run: |
          docker run --detach --name internal-auth-acceptance-postgres \
            --publish 127.0.0.1:55432:5432 \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=mynutri_test_internal_auth_ci \
            --health-cmd 'pg_isready -U postgres -d mynutri_test_internal_auth_ci' \
            --health-interval 5s --health-timeout 5s --health-retries 10 postgres:16
          for attempt in {1..60}; do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' internal-auth-acceptance-postgres)" == healthy ]]; then
              exit 0
            fi
            sleep 1
          done
          echo "Disposable PostgreSQL did not become healthy."
          exit 1
      - name: Migrate disposable database and verify real internal authentication
        working-directory: backend
        run: |
          python -m scripts.bootstrap_disposable_database
          python -m scripts.internal_auth_acceptance
      - name: Mandatory disposable acceptance cleanup
        if: always()
        run: |
          docker rm --force --volumes internal-auth-acceptance-postgres
          if docker inspect internal-auth-acceptance-postgres >/dev/null 2>&1; then
            echo "Disposable acceptance container survived cleanup."
            exit 1
          fi


  ci-summary:
    name: CI required summary
    if: always()
    needs:
      - backend-summary
      - frontend
      - e2e
      - internal-auth-acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Download functional shard evidence
        id: shard_evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-shard-evidence-*
          path: playwright-shard-evidence
      - name: Verify required jobs and functional shard coverage
        shell: bash
        env:
          BACKEND_RESULT: ${{ needs['backend-summary'].result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          INTERNAL_AUTH_RESULT: ${{ needs['internal-auth-acceptance'].result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          from collections import Counter
          from pathlib import Path

          evidence_root = Path("playwright-shard-evidence")
          expected_total = int(os.environ["EXPECTED_FUNCTIONAL_PLAYWRIGHT_TESTS"])
          expected_shards = set(range(1, 5))
          errors = []

          for job_name, result in (
              ("backend-summary", os.environ["BACKEND_RESULT"]),
              ("frontend", os.environ["FRONTEND_RESULT"]),
              ("e2e", os.environ["E2E_RESULT"]),
              ("internal-auth-acceptance", os.environ["INTERNAL_AUTH_RESULT"]),
          ):
              if result != "success":
                  errors.append(f"Required job {job_name} finished with {result}.")

          def collection(path):
              report = json.loads(path.read_text(encoding="utf-8"))
              entries = {}

              def visit(suite):
                  for spec in suite.get("specs", []):
                      for test in spec.get("tests", []):
                          if test.get("projectName") != "foods-chromium":
                              continue
                          test_id = f"foods-chromium::{spec['id']}"
                          if test_id in entries:
                              errors.append(f"Duplicate test identity inside {path}: {test_id}")
                          entries[test_id] = {
                              "file": spec.get("file"),
                              "line": spec.get("line"),
                              "status": test.get("status"),
                              "results": [result.get("status") for result in test.get("results", [])],
                          }
                  for child in suite.get("suites", []):
                      visit(child)

              for suite in report.get("suites", []):
                  visit(suite)
              return entries

          metadata_paths = sorted(evidence_root.rglob("metadata.json"))
          shards = {}
          for metadata_path in metadata_paths:
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              shard = metadata.get("shardIndex")
              if shard in shards:
                  errors.append(f"Duplicate evidence artifact for shard {shard}.")
                  continue
              if metadata.get("shardTotal") != 4:
                  errors.append(f"Shard {shard} reports shardTotal={metadata.get('shardTotal')} instead of 4.")
              if metadata.get("expectedTests") != expected_total:
                  errors.append(
                      f"Shard {shard} expectedTests={metadata.get('expectedTests')} instead of {expected_total}."
                  )
              base = metadata_path.parent
              required_files = {
                  "full": base / "full-collection.json",
                  "assigned": base / "assigned-collection.json",
                  "actual": base / "actual-results.json",
              }
              missing = [name for name, path in required_files.items() if not path.is_file()]
              if missing:
                  errors.append(f"Shard {shard} is missing evidence: {', '.join(missing)}.")
                  continue
              shards[shard] = {name: collection(path) for name, path in required_files.items()}

          discovered_shards = set(shards)
          if discovered_shards != expected_shards:
              errors.append(
                  f"Expected evidence for shards {sorted(expected_shards)}; found {sorted(discovered_shards)}."
              )

          if shards:
              reference_full = set(next(iter(shards.values()))["full"])
              if len(reference_full) != expected_total:
                  errors.append(
                      f"Unsharded collection has {len(reference_full)} tests; expected {expected_total}."
                  )

              assigned_occurrences = Counter()
              actual_occurrences = Counter()
              for shard in sorted(shards):
                  full = set(shards[shard]["full"])
                  assigned = set(shards[shard]["assigned"])
                  actual = set(shards[shard]["actual"])
                  if full != reference_full:
                      errors.append(f"Shard {shard} observed a different unsharded collection.")
                  if actual != assigned:
                      missing_actual = sorted(assigned - actual)
                      unexpected_actual = sorted(actual - assigned)
                      errors.append(
                          f"Shard {shard} execution differs from assignment: "
                          f"missing={len(missing_actual)}, unexpected={len(unexpected_actual)}."
                      )
                  for test_id, entry in shards[shard]["actual"].items():
                      if entry["status"] != "expected" or entry["results"] != ["passed"]:
                          errors.append(
                              f"Shard {shard} did not execute {test_id} exactly once successfully: "
                              f"status={entry['status']}, results={entry['results']}."
                          )
                  assigned_occurrences.update(assigned)
                  actual_occurrences.update(actual)
                  print(f"Shard {shard}: assigned={len(assigned)}, executed={len(actual)}")

              assigned_union = set(assigned_occurrences)
              actual_union = set(actual_occurrences)
              assigned_duplicates = [key for key, count in assigned_occurrences.items() if count != 1]
              actual_duplicates = [key for key, count in actual_occurrences.items() if count != 1]
              if assigned_union != reference_full:
                  errors.append(
                      f"Assigned shard union differs from full collection: "
                      f"missing={len(reference_full - assigned_union)}, "
                      f"unexpected={len(assigned_union - reference_full)}."
                  )
              if actual_union != reference_full:
                  errors.append(
                      f"Executed shard union differs from full collection: "
                      f"missing={len(reference_full - actual_union)}, "
                      f"unexpected={len(actual_union - reference_full)}."
                  )
              if assigned_duplicates:
                  errors.append(f"Assigned shard collections contain {len(assigned_duplicates)} duplicate tests.")
              if actual_duplicates:
                  errors.append(f"Shard executions contain {len(actual_duplicates)} duplicate tests.")

              print(f"Unsharded collection: {len(reference_full)} tests")
              print(f"Assigned union: {len(assigned_union)} tests; duplicates: {len(assigned_duplicates)}")
              print(f"Executed union: {len(actual_union)} tests; duplicates: {len(actual_duplicates)}")

          if errors:
              print("CI aggregation failed:", file=sys.stderr)
              for error in errors:
                  print(f"- {error}", file=sys.stderr)
              sys.exit(1)

          print("All required jobs passed and all functional Playwright tests executed exactly once across four shards.")
          PY
