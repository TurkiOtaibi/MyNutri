# Isolated, disposable Auth provider used only by the Plan 020 CI acceptance gate.
project_id = "mynutri-plan020-provider-ci"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

# Supabase CLI 2.111.0 names its bundled Mailpit service local_smtp.
[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
admin_email = "plan020-provider@example.test"
sender_name = "myNutri local provider"

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
email_sent = 50
sms_sent = 1
anonymous_users = 1
token_refresh = 150
sign_in_sign_ups = 50
token_verifications = 50
web3 = 1

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
# Deliberately short and local-only so real provider expiry is practical in CI.
otp_expiry = 20

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
